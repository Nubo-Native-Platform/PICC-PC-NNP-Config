# Database and HikariCP connection pool properties
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}

# Disable Spring Cloud Config's built-in JdbcEnvironmentRepository.
# The application uses its own custom JdbcNNPConfigServiceImpl; the built-in backend
# requires a generic PROPERTIES table that does not exist.
spring.cloud.config.server.jdbc.enabled=false
