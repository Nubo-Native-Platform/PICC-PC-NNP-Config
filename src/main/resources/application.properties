spring.application.name=${SPRING_APPLICATION_NAME:nnp-config}
server.port=${SERVER_PORT:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:${profiles:jdbc,local}}

# Include native profile so Spring Cloud Config Server uses NativeEnvironmentRepository
# instead of defaulting to Git (which requires a git repository URI).
spring.profiles.include=${SPRING_PROFILES_INCLUDE:native}
spring.cloud.config.server.native.search-locations=${SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS:classpath:/config}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
logging.level.root=${LOGGING_LEVEL:${logging_level:INFO}}
logging.pattern.console=%date [%t] %-5level [${spring.application.name},%X{traceId},%X{spanId}] [%X{transId},%X{msisdn},%X{requestId}] %logger{20}:%M:%L - %msg%n

quantum.safe.service.url=${QUANTUM_SAFE_SERVICE_URL:http://localhost:8080}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}